<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Equipamentos Gamer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    h1, h2 {
      color: #333;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #f2f2f2;
    }
    form {
      margin-bottom: 20px;
    }
    button {
      background-color: #007BFF;
      color: white;
      border: none;
      padding: 6px 12px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <h1>Equipamentos Gamer</h1>

  <h2>Adicionar novo equipamento</h2>
  <form method="POST" action="/gamer">
    <label>Nome:</label><br>
    <input type="text" name="nome" required><br><br>

    <label>Categoria:</label><br>
    <input type="text" name="categoria" required><br><br>

    <label>Quantidade:</label><br>
    <input type="number" name="quantidade" required><br><br>

    <button type="submit">Adicionar</button>
  </form>

  <table>
    <thead>
      <tr>
        {% for coluna in dados[0].keys() %}
          <th>{{ coluna }}</th>
        {% endfor %}
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      {% for linha in dados %}
        <tr>
          {% for valor in linha.values() %}
            <td>{{ valor }}</td>
          {% endfor %}
          <td>
            <form method="POST" action="/gamer/deletar">
              <input type="hidden" name="nome" value="{{ linha.nome }}">
              <button type="submit">Excluir</button>
            </form>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
