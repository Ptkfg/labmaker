<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Equipamentos Gamer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    h1, h2 {
      color: #333;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #f2f2f2;
    }
    form {
      margin-bottom: 20px;
    }
    button {
      background-color: #007BFF;
      color: white;
      border: none;
      padding: 6px 12px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <h1>Equipamentos Gamer</h1>

  <h2>Adicionar novo equipamento</h2>
  <form method="POST" action="/gamer">
    <label>Nome:</label><br>
    <input type="text" name="nome" required><br><br>

    <label>Categoria:</label><br>
    <input type="text" name="categoria" required><br><br>

    <label>Quantidade:</label><br>
    <input type="number" name="quantidade" required><br><br>

    <button type="submit">Adicionar</button>
  </form>

  <h2>Equipamentos cadastrados</h2>
  <table>
    <thead>
      <tr>
        <th>Nome</th>
        <th>Categoria</th>
        <th>Quantidade</th>
      </tr>
    </thead>
    <tbody>
      {% for item in dados %}
      <tr>
        <td>{{ item.nome }}</td>
        <td>{{ item.categoria }}</td>
        <td>{{ item.quantidade }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <br><br>
  <a href="/">
    <button>Voltar para a Página Principal</button>
  </a>
</body>
</html>
