<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>{{ maker }}</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    h1, h2 {
      color: #333;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #f2f2f2;
    }
    form {
      margin-bottom: 20px;
    }
    button {
      background-color: #007BFF;
      color: white;
      border: none;
      padding: 6px 12px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;

    }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
  </style>
</head>
<body>
  <h1>{{ maker }}</h1>

  <h2>Cadastro equipamentos de consumo</h2>
  <form method="post">
      <label>Nome</label><br>
      <input type="text" name="nome" required><br><br>

      <label>Garantia</label><br>
      <input type="text" name="garantia" required><br><br>

      <label>Cor</label><br>
      <input type="text" name="cor" required><br><br>

      <label>Fabricante/Marca</label><br>
      <input type="text" name="fabricante_marca" required><br><br>

      <label>Modelo</label><br>
      <input type="text" name="modelo" required><br><br>

      <label>Número de serie</label><br>
      <input type="text" name="numero_serie" required><br><br>

      <label>Data fabricação</label><br>
      <input type="text" name="data_fabricacao" required><br><br>

      <label>Validade</label><br>
      <input type="text" name="validade" required><br><br>

      <label>Condição/localização</label><br>
      <input type="text" name="condicao_localizacao" required><br><br>

      <label>Patrimônio</label><br>
      <input type="text" name="patrimonio" required><br><br>

      <label>Quantidade</label><br>
      <input type="text" name="quantidade" required><br><br>

      <button type="submit">Cadastrar</button>

  </form>
    <table>
    <thead>
      <tr>
        {% for coluna in dados[0].keys() %}
          <th>{{ coluna }}</th>
        {% endfor %}
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      {% for linha in dados %}
        <tr>
          {% for valor in linha.values() %}
            <td>{{ valor }}</td>
          {% endfor %}
          <td>
            <form method="POST" action="/maker/deletar">
              <input type="hidden" name="nome" value="{{ linha.nome }}">
              <button type="submit">Excluir</button>
            </form>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
<br><br>
<a href="/" style="text-decoration: none;">
  <button style="background-color: #007BFF; color: white; border: none; padding: 10px 20px; cursor: pointer;">
    Voltar para a Página Principal
  </button>
</a>
</body>
</html>
