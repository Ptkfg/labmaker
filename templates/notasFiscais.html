<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>{{ titulo }}</title>
  <style>
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
  </style>
</head>
<body>
  <h1>{{ notasFiscais }}</h1>

  <h2>Cadastro de notas fiscais</h2>
  <form method="post" action="notasFiscais.html">
      <label>Descrição dos itens</label><br>
      <input type="text" name="descricao_itens" required><br><br>

      <label>Número da NF</label><br>
      <input type="text" name="numero_nf" required><br><br>

      <label>Data de emissão</label><br>
      <input type="text" name="data_emissao" required><br><br>

      <label>Fornecedor</label><br>
      <input type="text" name="fornecedor" required><br><br>

      <label>CNPJ</label><br>
      <input type="text" name="cnpj" required><br><br>

      <label>Quantidade</label><br>
      <input type="text" name="quantidade" required><br><br>

      <label>Valor total</label><br>
      <input type="text" name="valor_total" required><br><br>

      <button type="submit">Cadastrar</button><br>

  </form>
<table>
    <thead>
      <tr>
        {% for coluna in dados[0].keys() %}
          <th>{{ coluna }}</th>
        {% endfor %}
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      {% for linha in dados %}
        <tr>
          {% for valor in linha.values() %}
            <td>{{ valor }}</td>
          {% endfor %}
          <td>
            <form method="POST" action="/notasFiscais/deletar">
              <input type="hidden" name="nome" value="{{ linha.nome }}">
              <button type="submit">Excluir</button>
            </form>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
<br><br>
<a href="/" style="text-decoration: none;">
  <button style="background-color: #007BFF; color: white; border: none; padding: 10px 20px; cursor: pointer;">
    Voltar para a Página Principal
  </button>
</a>
</body>
</html>
